name: Cliques do Telegram (opcional)

# Processa só os cliques em "Me candidatei" / "Descartar" e atualiza a planilha.
# Não busca vagas, não usa o Gemini e não mexe no banco de dados.
# Em repositório PÚBLICO não gasta minutos do plano. Em repositório privado, troque o cron
# por '0 * * * *' (a cada hora) para ficar dentro do plano gratuito.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: radar-de-vagas
  cancel-in-progress: false

jobs:
  cliques:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aceder ao código
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml gspread google-auth

      - name: Processar cliques e lembretes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python telegram_acoes.py
