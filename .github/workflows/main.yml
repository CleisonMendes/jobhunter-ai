name: JobHunter AI Automacao

on:
  schedule:
    # Executa automaticamente no minuto 0 a cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Adiciona um botão para poder executar manualmente quando quiser

jobs:
  procurar-vagas:
    runs-on: ubuntu-latest
    
    # ⚠️ PERMISSÃO NECESSÁRIA PARA O ROBÔ SALVAR O BANCO DE DADOS ⚠️
    permissions:
      contents: write

    steps:
      - name: Aceder ao código
        uses: actions/checkout@v3

      - name: Preparar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Executar o JobHunter AI
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar e persistir Banco de Dados de vagas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Adiciona o banco de dados modificado ao histórico do Git
          git add vagas_enviadas.db || true
          # Salva a alteração apenas se houver novos registros
          git commit -m "🤖 DB: Atualizando histórico de vagas enviadas [skip ci]" || true
          git push || true
